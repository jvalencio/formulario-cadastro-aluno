<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <header>
        <div>
            <h1>Cadastro de Aluno</h1>
            <p>Preencha seus dados abaixo para concluir o cadastro.</p>
        </div>
    </header>

    <main>
        <form>
            <fieldset>
                <legend>Dados Pessoais</legend>

                <div>
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div>
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                </div>

                <div>
                    <label for="data_nascimento">Data de Nascimento</label>
                    <input type="date" id="data_nascimento" name="data_nascimento" required>
                </div>

                <div>
                    <label for="email">E-mail</label>
                    <input type="text" id="email" name="email" required>
                </div>

                <div>
                    <label for="Telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" maxlength="15" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <div>
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required>
                </div>

                <div>
                    <label for="rua">Rua</label>
                    <input type="text" id="rua" name="rua" placeholder="Ex.: Av. Paulista" required>
                </div>

                <div>
                    <label for="numero">Número</label>
                    <input type="text" id="numero" name="numero" required>
                </div>

                <div>
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" name="bairro" required>
                </div>

                <div>
                    <label for="complemento">Complemento</label>
                    <input type="text" id="complemento" name="complemento" placeholder="Ex.: Apto 101">
                </div>

                <div>
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" required>
                </div>

                <div>
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione</option>
                        <option value="ac">Acre</option>
                        <option value="al">Alagoas</option>
                        <option value="ap">Amapá</option>
                        <option value="am">Amazonas</option>
                        <option value="ba">Bahia</option>
                        <option value="ce">Ceará</option>
                        <option value="df">Distrito Federal</option>
                        <option value="es">Espírito Santo</option>
                        <option value="go">Goiás</option>
                        <option value="ma">Maranhão</option>
                        <option value="mt">Mato Grosso</option>
                        <option value="ms">Mato Grosso do Sul</option>
                        <option value="mg">Minas Gerais</option>
                        <option value="pa">Pará</option>
                        <option value="pb">Paraíba</option>
                        <option value="pr">Paraná</option>
                        <option value="pe">Pernambuco</option>
                        <option value="pi">Piauí</option>
                        <option value="rj">Rio de Janeiro</option>
                        <option value="rn">Rio Grande do Norte</option>
                        <option value="rs">Rio Grande do Sul</option>
                        <option value="ro">Rondônia</option>
                        <option value="rr">Roraima</option>
                        <option value="sc">Santa Catarina</option>
                        <option value="sp">São Paulo</option>
                        <option value="se">Sergipe</option>
                        <option value="to">Tocantins</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>Dados Acadêmicos</legend>

                <div>
                    <label for="ra">RA</label>
                    <input type="text" id="ra" name="ra" required>
                </div>

                <div>
                    <label for="curso">Curso</label>
                    <select id="curso" name="curso" required>
                        <option value="">Selecione</option>
                        <option value="ads">Análise e Desenvolvimento de Sistemas</option>
                        <option value="cc">Ciência da Computação</option>
                        <optino value="cd">Ciência de Dados</optino>
                        <option value="eng_software">Engenharia de Software</option>
                        <option value="eng_computacao">Engenharia de Computação</option>
                        <option value="gti">Gestão da Tecnologia da Informação</option>
                        <option value="ia">Inteligência Artificial</option>
                        <option value="jogos_digitais">Jogos Digitais</option>
                        <option value="redes">Redes de Computadores</option>
                        <option value="seg_info">Segurança da Informação</option>
                        <option value="si">Sistemas de Informação</option>

                    </select>
                </div>

                <div>
                    <label for="semestre">Semestre</label>
                    <input type="text" id="semestre" name="semestre" placeholder="Ex.: 2" maxlength="2" required>
                </div>

                <div>
                    <label for="turno">Turno</label>
                    <select id="turno" name="turno" required>
                        <option value="int">Integral</option>
                        <option value="mat">Matutino</option>
                        <option value="ves">Vespertino</option>
                        <option value="not">Noturno</option>
                    </select>
                </div>
            </fieldset>

            <button type="submit">Enviar</button>
        </form>
    </main>
</body>
</html>
